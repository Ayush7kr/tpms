{% extends 'base/base.html' %}

{% block title %}{{ error_title }}{% endblock %}

{% block layout_content %}
<main class="error-shell">
  <div class="error-card">
    <div class="error-code mb-3">{{ status_code }}</div>
    <h1 class="h3 mb-2">{{ error_title }}</h1>
    <p class="text-muted mb-4">{{ error_message }}</p>
    {% if user.is_authenticated %}
      <a href="{{ user.get_dashboard_url }}" class="btn btn-primary">Back to your dashboard</a>
    {% else %}
      <a href="{% url 'core:landing' %}" class="btn btn-primary">Back to home</a>
    {% endif %}
  </div>
</main>
{% endblock %}
