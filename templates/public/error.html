{% extends 'base/base.html' %}

{% block title %}{{ status_code }} — {{ error_title }}{% endblock %}

{% block layout_content %}
<div class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-4 bg-light">
  <div class="card p-5 border shadow-sm rounded-4" style="max-width: 520px;">
    <div class="display-1 fw-bold text-primary mb-3">{{ status_code }}</div>
    <h3 class="fw-bold text-dark mb-2">{{ error_title }}</h3>
    <p class="text-muted mb-4">{{ error_message }}</p>
    <div>
      {% if user.is_authenticated %}
        <a href="{{ user.get_dashboard_url }}" class="btn-tpms-primary">
          <i class="bi bi-speedometer2"></i> Return to Dashboard
        </a>
      {% else %}
        <a href="{% url 'core:landing' %}" class="btn-tpms-primary">
          <i class="bi bi-house-door-fill"></i> Return to Homepage
        </a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
